<!doctype html>
<!--

    Vanilla HTML/CSS/JS · LXRCore design tokens · Georgian-safe font stack · no CDN
    © 2026 iBoss21 / LXRCore | lxrcore.com | All Rights Reserved
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LXR Multicharacter</title>
    <link rel="stylesheet" href="lxr-ui.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="lxr">
<div id="app" class="hidden">
    <aside class="lxr-hit lxr-panel lxr-panel--list">
        <header class="lxr-banner">
            <div class="lxr-banner__avatar-wrap">
                <img id="brand-logo" class="lxr-banner__avatar" src="img/lxrcore-logo.png" alt="LXRCore">
            </div>
            <div class="lxr-banner__text">
                <div id="server-name" class="lxr-banner__title">LXRCore</div>
                <div id="server-tagline" class="lxr-banner__sub"></div>
            </div>
        </header>

        <div class="lxr-hit lxr-panel__head">
            <h1 id="t-title" class="lxr-title">Choose your character</h1>
            <p id="t-subtitle" class="lxr-muted"></p>
            <p id="slots" class="lxr-slots"></p>
        </div>

        <div id="loading" class="lxr-loading">
            <span class="lxr-spinner"></span>
            <span id="t-loading">Fetching your characters…</span>
        </div>

        <ul id="character-list" class="lxr-list lxr-scroll-minimal"></ul>

        <footer class="lxr-hit lxr-panel__foot">
            <button id="btn-disconnect" class="cfg-btn cfg-btn--ghost">Leave server</button>
        </footer>
    </aside>

    <section class="lxr-hit lxr-panel lxr-panel--detail" id="detail" hidden>
        <h2 id="detail-name" class="lxr-title lxr-title--lg"></h2>
        <dl class="lxr-facts">
            <div><dt id="t-job">Occupation</dt><dd id="d-job"></dd></div>
            <div><dt id="t-born">Born</dt><dd id="d-born"></dd></div>
            <div><dt id="t-nationality">Nationality</dt><dd id="d-nationality"></dd></div>
            <div><dt id="t-cash">Cash</dt><dd id="d-cash"></dd></div>
            <div><dt id="t-bank">Bank</dt><dd id="d-bank"></dd></div>
            <div><dt id="t-last">Last seen</dt><dd id="d-last"></dd></div>
        </dl>
        <div class="lxr-actions">
            <button id="btn-play" class="cfg-btn cfg-btn--primary">Ride out</button>
            <button id="btn-delete" class="cfg-btn cfg-btn--danger">Delete</button>
        </div>
    </section>

    <!-- create modal -->
    <div id="modal-create" class="modal hidden">
        <form id="form-create" class="lxr-hit cfg-modal" autocomplete="off">
            <h2 id="t-create-title" class="lxr-title">Create a character</h2>
            <div class="cfg-grid">
                <label><span id="t-firstname">First name</span><input class="cfg-input" name="firstname" maxlength="20" required></label>
                <label><span id="t-lastname">Last name</span><input class="cfg-input" name="lastname" maxlength="20" required></label>
                <label><span id="t-birthdate">Birth date</span><input class="cfg-input" name="birthdate" placeholder="1875-06-12" pattern="\d{4}-\d{2}-\d{2}" required></label>
                <label><span id="t-nationality-l">Nationality</span><input class="cfg-input" name="nationality" maxlength="30" id="nationality-input"></label>
            </div>
            <fieldset class="cfg-gender">
                <legend id="t-gender">Gender</legend>
                <label><input type="radio" name="gender" value="0" checked><span id="t-male">Male</span></label>
                <label><input type="radio" name="gender" value="1"><span id="t-female">Female</span></label>
            </fieldset>
            <p id="create-error" class="lxr-error" hidden></p>
            <div class="lxr-hit cfg-modal__footer">
                <button type="button" id="btn-create-cancel" class="cfg-btn cfg-btn--ghost">Cancel</button>
                <button type="submit" id="btn-create-confirm" class="cfg-btn cfg-btn--primary">Create</button>
            </div>
        </form>
    </div>

    <!-- delete modal -->
    <div id="modal-delete" class="modal hidden">
        <div class="lxr-hit cfg-modal">
            <p id="delete-text" class="lxr-lead"></p>
            <div class="lxr-hit cfg-modal__footer">
                <button type="button" id="btn-delete-cancel" class="cfg-btn cfg-btn--ghost">Cancel</button>
                <button type="button" id="btn-delete-confirm" class="cfg-btn cfg-btn--danger">Yes, delete</button>
            </div>
        </div>
    </div>
</div>
<script src="app.js"></script>
</body>
</html>
